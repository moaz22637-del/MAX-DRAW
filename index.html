<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>👑 NEON DRAW - الملكي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root {
    --primary: #00f3ff; 
    --secondary: #ff00ea; 
    --success: #00ff88;
    --danger: #ff3333; 
    --warning: #ffcc00;
    --gold: #ffd700;
    --dark-bg: #050510;
    --glass: rgba(255, 255, 255, 0.04);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glow: 0 0 20px rgba(0, 243, 255, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }

  body {
    background-color: var(--dark-bg);
    color: white;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.15), transparent 30%),
      radial-gradient(circle at 90% 80%, rgba(255, 0, 234, 0.15), transparent 30%),
      linear-gradient(135deg, #050510 0%, #111133 100%);
  }

  .screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100dvh; padding: 20px; z-index: 10; }
  .screen.active { display: flex; }
  
  .glass-panel {
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    padding: 40px 30px;
    border-radius: 28px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.05);
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

  .logo-title {
    font-size: 42px;
    font-weight: 900;
    background: linear-gradient(to right, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
    text-shadow: var(--glow);
  }

  .round-selector { display: flex; gap: 8px; margin: 15px 0; justify-content: center; flex-wrap: wrap;}
  .round-btn {
    flex: 1; padding: 12px; background: rgba(0,0,0,0.5); border: 2px solid var(--glass-border);
    color: white; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; min-width: 70px;
  }
  .round-btn.active { border-color: var(--primary); background: rgba(0, 243, 255, 0.1); box-shadow: var(--glow); color: var(--primary); }

  input {
    width: 100%; padding: 16px; margin: 10px 0;
    background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 16px; color: white; font-size: 18px; text-align: center; transition: 0.3s;
  }
  input:focus { outline: none; border-color: var(--primary); box-shadow: var(--glow); }

  .btn {
    width: 100%; padding: 18px; margin: 10px 0; border: none;
    border-radius: 16px; font-size: 20px; font-weight: 900; cursor: pointer; transition: 0.2s;
    position: relative; overflow: hidden;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: linear-gradient(45deg, #00f3ff, #0051ff); color: white; box-shadow: 0 10px 20px rgba(0, 81, 255, 0.3); }
  .btn-secondary { background: transparent; border: 2px solid var(--secondary); color: var(--secondary); box-shadow: 0 0 15px rgba(255, 0, 234, 0.2); }

  .code-display {
    font-size: 64px; font-weight: 900; letter-spacing: 12px;
    color: var(--primary); margin: 20px 0; font-family: monospace; text-shadow: var(--glow);
  }

  .game-container { display: none; flex-direction: column; height: 100dvh; width: 100vw; overflow: hidden; }
  .game-container.active { display: flex; }
  
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 20px; background: rgba(0,0,0,0.8);
    border-bottom: 1px solid var(--glass-border); height: 75px; flex-shrink: 0;
    backdrop-filter: blur(10px);
  }

  .score-box { display: flex; gap: 40px; align-items: center; width: 100%; justify-content: center;}
  .score-item { text-align: center; position: relative; }
  .score-name { font-size: 13px; color: #aaa; font-weight: 700; letter-spacing: 1px; }
  .score-val { font-size: 28px; font-weight: 900; color: var(--success); text-shadow: 0 0 15px rgba(0, 255, 136, 0.5); }
  .warnings { color: var(--danger); font-size: 16px; position: absolute; top: -15px; right: -25px; letter-spacing: 2px; text-shadow: 0 0 10px red;}
  
  .round-display { position: absolute; top: 10px; left: 15px; font-size: 14px; font-weight: 700; color: var(--gold); text-shadow: 0 0 10px var(--gold); }

  .timer-container { width: 100%; height: 8px; background: rgba(255,255,255,0.05); flex-shrink: 0; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }
  .timer-bar { height: 100%; width: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 1s linear, background 0.5s; box-shadow: var(--glow); }
  
  .word-display {
    text-align: center; padding: 12px; flex-shrink: 0;
    background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.1), transparent);
    font-size: 24px; font-weight: 900; color: var(--primary); letter-spacing: 3px; text-shadow: var(--glow);
  }

  .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
  .canvas-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 10px; min-height: 0; }
  
  canvas {
    background: #ffffff; border-radius: 16px; touch-action: none;
    max-width: 100%; max-height: 100%; cursor: crosshair;
    box-shadow: 0 0 30px rgba(255,255,255,0.1), inset 0 0 20px rgba(0,0,0,0.1);
    border: 2px solid rgba(255,255,255,0.2);
  }

  .tools-bar {
    display: flex; gap: 12px; padding: 10px; background: rgba(0,0,0,0.8);
    justify-content: center; align-items: center; flex-shrink: 0; border-top: 1px solid var(--glass-border);
  }

  .color-btn { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  .color-btn.active { border-color: white; transform: scale(1.2); box-shadow: 0 0 15px white; }
  
  .tool-btn {
    background: var(--glass); border: 1px solid var(--glass-border);
    color: white; padding: 8px 15px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 700; transition: 0.2s;
  }
  .tool-btn:active { transform: scale(0.95); }

  .chat-area { height: 35%; min-height: 160px; display: flex; flex-direction: column; background: rgba(5,5,16,0.95); flex-shrink: 0; border-top: 1px solid var(--glass-border); }
  .chat-header { display: flex; justify-content: space-between; padding: 6px 15px; background: rgba(255,255,255,0.03); font-size: 13px; font-weight: 700; color: var(--warning); }
  .messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  
  .msg { padding: 8px 14px; border-radius: 12px; font-size: 15px; font-weight: 700; background: rgba(255,255,255,0.08); align-self: flex-start; max-width: 80%; animation: fadeIn 0.3s; }
  .msg.mine { background: rgba(0, 243, 255, 0.15); border: 1px solid rgba(0, 243, 255, 0.3); align-self: flex-end; color: #aaffff; }
  .msg.correct { background: rgba(0, 255, 136, 0.2); border: 1px solid var(--success); color: var(--success); box-shadow: 0 0 10px rgba(0,255,136,0.3); }
  .msg.system { background: transparent; color: var(--danger); font-size: 13px; align-self: center; text-align: center; box-shadow: none; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .guess-input-area { display: flex; padding: 12px; gap: 10px; background: rgba(0,0,0,0.9); flex-shrink: 0; border-top: 1px solid var(--glass-border); }
  .guess-input-area input { margin: 0; text-align: right; padding: 14px; font-size: 16px; flex: 1; background: rgba(255,255,255,0.05); }
  .guess-input-area button { margin: 0; padding: 0 25px; width: auto; font-size: 16px; border-radius: 12px; }

  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); display: none; justify-content: center; align-items: center; z-index: 100; }
  .modal.active { display: flex; }
  .modal .glass-panel { border-color: var(--primary); box-shadow: 0 0 50px rgba(0,243,255,0.2); }
</style>
</head>
<body>

  <div id="screen-home" class="screen active">
    <div class="glass-panel">
      <h1 class="logo-title">NEON DRAW</h1>
      <p style="color:#aaa; margin-bottom:20px; font-weight:700;">اختر نقاط الفوز (الهدف)</p>
      
      <div class="round-selector" id="target-selector">
        <button class="round-btn" onclick="setTarget(100, this)">100</button>
        <button class="round-btn active" onclick="setTarget(300, this)">300</button>
        <button class="round-btn" onclick="setTarget(500, this)">500</button>
        <button class="round-btn" onclick="setTarget(1000, this)">1000</button>
      </div>
      <input type="number" id="custom-target" placeholder="أو اكتب رقم مخصص..." style="margin-bottom: 20px;">
      
      <button class="btn btn-primary" onclick="createRoom()">➕ إنشاء غرفة</button>
      <button class="btn btn-secondary" onclick="showScreen('screen-join')">🔗 انضمام بكود</button>
    </div>
  </div>

  <div id="screen-join" class="screen">
    <div class="glass-panel">
      <h2 style="font-size:28px; margin-bottom:20px;">ادخل الكود</h2>
      <input type="number" id="join-code" placeholder="1234" maxlength="4" inputmode="numeric">
      <button class="btn btn-primary" onclick="joinRoom()" id="join-btn">دخول</button>
      <button class="btn btn-secondary" onclick="showScreen('screen-home')">رجوع</button>
      <p id="join-error" style="color:var(--danger); font-size:14px; margin-top:10px; font-weight:700;"></p>
    </div>
  </div>

  <div id="screen-waiting" class="screen">
    <div class="glass-panel">
      <h2 style="font-size:28px; margin-bottom:10px;">الغرفة جاهزة!</h2>
      <p style="color:#aaa;">ابعت الكود ده لصاحبك</p>
      <div class="code-display" id="room-code-display">----</div>
      <p style="color:var(--primary); font-weight:700; animation: pulse 1.5s infinite;">مستني حد ييجي...</p>
      <button class="btn btn-secondary" style="margin-top:20px;" onclick="cancelRoom()">إلغاء</button>
    </div>
  </div>

  <div id="game-container" class="game-container">
    <div class="top-bar">
      <div class="round-display" id="round-display">الهدف: 300</div>
      <div class="score-box">
        <div class="score-item">
          <div class="score-name">أنت</div>
          <div class="score-val" id="my-score">0</div>
          <div class="warnings" id="my-warnings"></div>
        </div>
        <div style="color:#555; font-weight:bold; font-size:20px;">VS</div>
        <div class="score-item">
          <div class="score-name">الخصم</div>
          <div class="score-val" id="opp-score">0</div>
          <div class="warnings" id="opp-warnings"></div>
        </div>
      </div>
    </div>
    
    <div class="timer-container">
      <div class="timer-bar" id="timer-bar"></div>
    </div>

    <div class="word-display" id="word-display">---</div>

    <div class="main-area">
      <div class="canvas-container">
        <canvas id="drawing-canvas" width="800" height="600"></canvas>
      </div>
      
      <div class="tools-bar" id="drawer-tools" style="display:none;">
        <div class="color-btn active" style="background:#000;" onclick="setColor('#000', this)"></div>
        <div class="color-btn" style="background:#ff3333;" onclick="setColor('#ff3333', this)"></div>
        <div class="color-btn" style="background:#00f3ff;" onclick="setColor('#00f3ff', this)"></div>
        <div class="color-btn" style="background:#00ff88;" onclick="setColor('#00ff88', this)"></div>
        <div class="color-btn" style="background:#ff00ea;" onclick="setColor('#ff00ea', this)"></div>
        <button class="tool-btn" onclick="setColor('#fff')">ممحاة</button>
        <button class="tool-btn" onclick="clearCanvas(true)" style="color:var(--danger); border-color:var(--danger);">مسح</button>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-header" id="chat-header">
        <span>التخمينات:</span>
        <span id="guesses-left-text">متبقي: 3</span>
      </div>
      <div class="messages" id="chat-messages"></div>
      <div class="guess-input-area" id="guesser-tools">
        <input type="text" id="guess-input" placeholder="اكتب تخمينك هنا..." onkeypress="if(event.key === 'Enter') sendGuess()">
        <button class="btn btn-primary" onclick="sendGuess()">تخمين</button>
      </div>
    </div>
  </div>

  <div class="modal" id="round-modal">
    <div class="glass-panel" style="text-align:center;">
      <h1 id="modal-title" style="font-size:36px; margin-bottom:15px;">اللعبة انتهت!</h1>
      <p id="modal-desc" style="color:#ccc; margin-bottom:25px; white-space: pre-line; font-size:16px; font-weight:700;">...</p>
      <button class="btn btn-primary" id="modal-btn" onclick="startNewRound()">الجولة الجاية</button>
    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD7WYn9T1-r2NlF-kMcuQWN07T5wxQRcbw",
    authDomain: "ddmm-d24cf.firebaseapp.com",
    databaseURL: "https://ddmm-d24cf-default-rtdb.firebaseio.com",
    projectId: "ddmm-d24cf",
    storageBucket: "ddmm-d24cf.firebasestorage.app",
    messagingSenderId: "1070949465971",
    appId: "1:1070949465971:web:ca001b27495aaa984b4f06"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const WORDS = ["تفاحة", "سيارة", "شمس", "قمر", "بيت", "شجرة", "كتاب", "قهوة", "بحر", "ساعة", "موبايل", "كرسي", "قلم", "قطة", "كلب", "طيار", "صحراء", "مفتاح", "نظارة", "عصفور", "مدرسة", "مستشفى", "تليفزيون", "مطبخ", "حمام", "فيل", "زرافة", "أسد", "نمر", "دب", "بطة", "فراولة", "برتقال", "ليمون", "عنب", "بطيخ", "مظلة", "حقيبة", "سكين", "شوكة", "ملعقة", "طبق", "كوب", "سجادة", "سرير", "مروحة", "لمبة", "مقص", "دبوس", "خيط"];
  const ROUND_TIME = 60; 

  let selectedTarget = 300;

  let state = {
    role: null, roomCode: null, currentDrawer: null, currentWord: '',
    myScore: 0, oppScore: 0, myWarnings: 0, oppWarnings: 0,
    myGuesses: 3, isDrawingMode: false, color: '#000',
    gameActive: false, startTime: 0, timerInterval: null
  };

  let roomRef = null;
  let canvas, ctx;
  let isPainting = false;
  let lastX = 0, lastY = 0;
  let isJoining = false;
  let canvasInitialized = false;

  function normalizeText(text) {
    return text.trim().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[\u064B-\u065F]/g, '');
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function setTarget(num, btn) {
    selectedTarget = num;
    document.querySelectorAll('.round-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('custom-target').value = '';
  }

  function randomCode() { return String(Math.floor(1000 + Math.random() * 9000)); }

  function getUniqueWord(usedWords) {
    let available = WORDS.filter(w => !usedWords.includes(w));
    if (available.length === 0) {
      usedWords = []; 
      available = WORDS;
    }
    const newWord = available[Math.floor(Math.random() * available.length)];
    usedWords.push(newWord);
    return { word: newWord, usedWords: usedWords };
  }

  function createRoom() {
    let targetScore = selectedTarget;
    const customVal = parseInt(document.getElementById('custom-target').value);
    if (customVal > 0) targetScore = customVal;

    const code = randomCode();
    state.role = 'host';
    state.roomCode = code;
    document.getElementById('room-code-display').innerText = code;
    showScreen('screen-waiting');

    roomRef = db.ref('draw-rooms/' + code);
    const firstWord = getUniqueWord([]);

    roomRef.set({
      host: true, guest: false, status: 'waiting', 
      currentDrawer: 'host', word: firstWord.word, usedWords: firstWord.usedWords,
      targetScore: targetScore,
      scoreHost: 0, scoreGuest: 0, warningsHost: 0, warningsGuest: 0,
      guessesHost: 3, guessesGuest: 3, startTime: Date.now()
    });

    setupChatListener();

    roomRef.on('value', snap => {
      const data = snap.val();
      if (!data) return;
      if (data.status === 'playing' || data.status === 'roundOver' || data.status === 'gameOver') {
        syncGame(data);
      }
    });
  }

  function joinRoom() {
    if (isJoining) return;
    const code = document.getElementById('join-code').value.trim();
    if (code.length !== 4) return document.getElementById('join-error').innerText = 'الكود 4 أرقام!';

    isJoining = true;
    document.getElementById('join-btn').innerText = 'جاري الدخول...';

    roomRef = db.ref('draw-rooms/' + code);
    roomRef.once('value').then(snap => {
      const data = snap.val();
      if (!data) {
        isJoining = false; document.getElementById('join-btn').innerText = 'دخول';
        return document.getElementById('join-error').innerText = 'الغرفة غير موجودة!';
      }
      if (data.guest) {
        isJoining = false; document.getElementById('join-btn').innerText = 'دخول';
        return document.getElementById('join-error').innerText = 'الغرفة مليانة!';
      }

      state.role = 'guest';
      state.roomCode = code;
      
      roomRef.update({ guest: true, status: 'playing', startTime: Date.now() });
      
      setupChatListener();

      roomRef.on('value', snap => {
        const d = snap.val();
        if (d && (d.status === 'playing' || d.status === 'roundOver' || d.status === 'gameOver')) {
          syncGame(d);
        }
      });
    });
  }

  function setupChatListener() {
    db.ref('draw-rooms/' + state.roomCode + '/chat').on('child_added', snap => {
      const msg = snap.val();
      const chatBox = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = 'msg ' + (msg.sender === state.role ? 'mine' : 'theirs');
      if (msg.isCorrect) div.classList.add('correct');
      if (msg.isSystem) div.classList.add('system');
      div.innerText = msg.isSystem ? msg.text : (msg.sender === state.role ? 'أنت: ' : 'الخصم: ') + msg.text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  }

  function startNewRound() {
    if (state.role !== 'host') return;
    document.getElementById('round-modal').classList.remove('active');
    
    roomRef.once('value').then(snap => {
      const data = snap.val();
      const nextDrawer = data.currentDrawer === 'host' ? 'guest' : 'host';
      const wordData = getUniqueWord(data.usedWords || []);
      
      roomRef.update({
        status: 'playing', currentDrawer: nextDrawer, word: wordData.word, usedWords: wordData.usedWords,
        drawingData: null, startTime: Date.now(), 
        guessesHost: 3, guessesGuest: 3
      });
      roomRef.child('chat').remove(); 
      clearCanvas(false);
    });
  }

  function syncGame(data) {
    if (!data) return;

    if (!document.getElementById('game-container').classList.contains('active')) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('game-container').classList.add('active');
      if (!canvasInitialized) { initCanvas(); canvasInitialized = true; }
    }

    if (data.status === 'playing') {
      document.getElementById('round-modal').classList.remove('active');
      if (state.startTime !== data.startTime) {
        clearCanvas(false);
        document.getElementById('chat-messages').innerHTML = ''; 
      }
    }

    if (data.status === 'gameOver' || data.status === 'roundOver') {
      clearInterval(state.timerInterval);
      state.gameActive = false;
      
      if (data.status === 'gameOver') {
        document.getElementById('modal-title').innerText = '🏆 نهاية الماتش!';
        document.getElementById('modal-title').style.color = 'var(--gold)';
        document.getElementById('modal-desc').innerText = data.endReason;
        document.getElementById('modal-btn').style.display = 'none'; 
      } else {
        if (data.winner === 'none') {
          document.getElementById('modal-title').innerText = '⏰ الجولة انتهت!';
          document.getElementById('modal-title').style.color = 'var(--warning)';
        } else {
          document.getElementById('modal-title').innerText = data.winner === state.role ? '🎉 أنت كسبت الجولة!' : '😢 الخصم كسب';
          document.getElementById('modal-title').style.color = data.winner === state.role ? 'var(--success)' : 'var(--secondary)';
        }
        
        document.getElementById('modal-desc').innerText = `الكلمة كانت: ${data.word}\n${data.endReason || ''}`;
        document.getElementById('modal-btn').style.display = state.role === 'host' ? 'block' : 'none';
        if (state.role !== 'host') document.getElementById('modal-desc').innerText += '\n\n(مستني صاحبك...)';
      }
      document.getElementById('round-modal').classList.add('active');
      return;
    }

    state.currentDrawer = data.currentDrawer;
    state.currentWord = data.word;
    state.startTime = data.startTime;
    state.myScore = state.role === 'host' ? data.scoreHost : data.scoreGuest;
    state.oppScore = state.role === 'host' ? data.scoreGuest : data.scoreHost;
    state.myWarnings = state.role === 'host' ? data.warningsHost : data.warningsGuest;
    state.oppWarnings = state.role === 'host' ? data.warningsGuest : data.warningsHost;
    state.myGuesses = state.role === 'host' ? data.guessesHost : data.guessesGuest;

    document.getElementById('my-score').innerText = state.myScore;
    document.getElementById('opp-score').innerText = state.oppScore;
    document.getElementById('my-warnings').innerText = '⚠️'.repeat(state.myWarnings);
    document.getElementById('opp-warnings').innerText = '⚠️'.repeat(state.oppWarnings);
    document.getElementById('guesses-left-text').innerText = `متبقي: ${state.myGuesses}`;
    document.getElementById('round-display').innerText = `الهدف: ${data.targetScore}`;

    const amIDrawer = state.role === state.currentDrawer;

    if (amIDrawer) {
      document.getElementById('word-display').innerText = state.currentWord;
      document.getElementById('drawer-tools').style.display = 'flex';
      document.getElementById('guesser-tools').style.display = 'none';
      document.getElementById('chat-header').style.display = 'none';
      state.isDrawingMode = true;
    } else {
      document.getElementById('word-display').innerText = '???';
      document.getElementById('drawer-tools').style.display = 'none';
      document.getElementById('guesser-tools').style.display = 'flex';
      document.getElementById('chat-header').style.display = 'flex';
      state.isDrawingMode = false;

      const input = document.getElementById('guess-input');
      const btn = document.querySelector('#guesser-tools button');
      if (state.myGuesses <= 0) {
        input.disabled = true; btn.disabled = true; input.placeholder = 'خلصت التخمينات!';
      } else {
        input.disabled = false; btn.disabled = false; input.placeholder = 'اكتب تخمينك هنا...';
      }
    }

    if (data.status === 'playing' && !state.gameActive) {
      state.gameActive = true;
      startTimer();
    }
  }

  function startTimer() {
    clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
      if (!state.gameActive) return;
      
      const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
      const timeLeft = Math.max(0, ROUND_TIME - elapsed);
      
      const bar = document.getElementById('timer-bar');
      bar.style.width = (timeLeft / ROUND_TIME) * 100 + '%';
      bar.style.background = timeLeft <= 10 ? 'var(--danger)' : 'linear-gradient(90deg, var(--primary), var(--secondary))';

      if (timeLeft <= 0) {
        clearInterval(state.timerInterval);
        state.gameActive = false;
        
        if (state.role === 'host') {
          roomRef.once('value').then(snap => {
             const data = snap.val();
             if (data.status !== 'playing') return;

             let drawerWarnings = data.currentDrawer === 'host' ? data.warningsHost : data.warningsGuest;
             let drawerScore = data.currentDrawer === 'host' ? data.scoreHost : data.scoreGuest;
             const warningField = data.currentDrawer === 'host' ? 'warningsHost' : 'warningsGuest';
             const scoreField = data.currentDrawer === 'host' ? 'scoreHost' : 'scoreGuest';
             const guesserScoreField = data.currentDrawer === 'host' ? 'scoreGuest' : 'scoreHost';
             const currentGuesserScore = data.currentDrawer === 'host' ? data.scoreGuest : data.scoreHost;
             
             drawerWarnings += 1;
             let endMsg = `الوقت خلص! المخمن خسر 5 نقاط.`;
             if (drawerWarnings >= 3) {
               drawerScore = Math.max(0, drawerScore - 20);
               drawerWarnings = 0;
               endMsg += `\nالرسام وصل 3 إنذارات وخسر 20 نقطة!`;
             } else {
               endMsg += `\nالرسام أخد إنذار (${drawerWarnings}/3).`;
             }

             roomRef.update({
               status: 'roundOver', winner: 'none',
               [warningField]: drawerWarnings, [scoreField]: drawerScore,
               [guesserScoreField]: Math.max(0, currentGuesserScore - 5), endReason: endMsg
             });
          });
        }
      }
    }, 1000);
  }

  function initCanvas() {
    canvas = document.getElementById('drawing-canvas');
    ctx = canvas.getContext('2d');
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseout', stopDrawing);
    canvas.addEventListener('touchstart', handleTouchStart, {passive: false});
    canvas.addEventListener('touchmove', handleTouchMove, {passive: false});
    canvas.addEventListener('touchend', stopDrawing);
    
    roomRef.child('drawingData').on('child_added', snap => {
      const point = snap.val();
      if (!state.isDrawingMode) drawLine(point.x0, point.y0, point.x1, point.y1, point.color, point.width);
    });
  }

  function getCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    let clientX = e.clientX || (e.touches && e.touches[0].clientX);
    let clientY = e.clientY || (e.touches && e.touches[0].clientY);
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  function handleTouchStart(e) { e.preventDefault(); startDrawing(e); }
  function handleTouchMove(e) { e.preventDefault(); draw(e); }

  function startDrawing(e) {
    if (!state.isDrawingMode) return;
    isPainting = true;
    const coords = getCoords(e);
    lastX = coords.x; lastY = coords.y;
  }

  function draw(e) {
    if (!isPainting || !state.isDrawingMode) return;
    const coords = getCoords(e);
    const currentX = coords.x; const currentY = coords.y;
    const width = state.color === '#fff' ? 20 : 4;

    drawLine(lastX, lastY, currentX, currentY, state.color, width);
    roomRef.child('drawingData').push({ x0: lastX, y0: lastY, x1: currentX, y1: currentY, color: state.color, width: width });
    lastX = currentX; lastY = currentY;
  }

  function stopDrawing() { isPainting = false; }

  function drawLine(x0, y0, x1, y1, color, width) {
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke(); ctx.closePath();
  }

  function setColor(c, btn) {
    state.color = c;
    if (btn) {
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  }

  function clearCanvas(sync) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (sync && state.isDrawingMode) roomRef.update({ drawingData: null });
  }

  function sendGuess() {
    const input = document.getElementById('guess-input');
    const val = input.value.trim();
    if (!val || state.isDrawingMode || state.myGuesses <= 0) return;

    const isCorrect = normalizeText(val) === normalizeText(state.currentWord) || 
                      (val.length >= 3 && normalizeText(state.currentWord).includes(normalizeText(val)));

    roomRef.child('chat').push({ sender: state.role, text: val, isCorrect: isCorrect });

    if (isCorrect) {
      roomRef.once('value').then(snap => {
        const data = snap.val();
        if (data.status !== 'playing') return; 

        const timeTaken = Math.floor((Date.now() - data.startTime) / 1000);
        const points = Math.max(10, ROUND_TIME - timeTaken); 
        const scoreField = state.role === 'host' ? 'scoreHost' : 'scoreGuest';
        const currentScore = state.role === 'host' ? data.scoreHost : data.scoreGuest;
        const newScore = currentScore + points;
        
        // لو اللاعب وصل لنقاط الفوز
        if (newScore >= data.targetScore) {
          roomRef.update({
            status: 'gameOver', winner: state.role,
            [scoreField]: newScore,
            endReason: `خمن صح في ${timeTaken} ثانية وحصل على +${points} نقطة!\n\n🏆 مبروك! وصلت للهدف (${data.targetScore} نقطة) وكسبت الماتش!`
          });
        } else {
          roomRef.update({
            status: 'roundOver', winner: state.role,
            [scoreField]: newScore,
            endReason: `خمن صح في ${timeTaken} ثانية وحصل على +${points} نقطة!`
          });
        }
      });
      input.value = '';
    } else {
      input.value = '';
      const guessesField = state.role === 'host' ? 'guessesHost' : 'guessesGuest';
      const scoreField = state.role === 'host' ? 'scoreHost' : 'scoreGuest';
      const newGuesses = state.myGuesses - 1;
      
      if (newGuesses === 0) {
        roomRef.once('value').then(snap => {
          const data = snap.val();
          if (data.status !== 'playing') return;
          
          const currentScore = state.role === 'host' ? data.scoreHost : data.scoreGuest;
          roomRef.update({
            [guessesField]: 0,
            [scoreField]: Math.max(0, currentScore - 10),
            status: 'roundOver', winner: 'none',
            endReason: 'خلصت الـ 3 تخمينات، وخسرت 10 نقاط فوراً!'
          });
        });
      } else {
        roomRef.update({ [guessesField]: newGuesses });
      }
    }
  }

  function cancelRoom() {
    if (state.role === 'host' && roomRef) roomRef.remove();
    location.reload();
  }

  window.addEventListener('beforeunload', () => {
    if (state.role === 'host' && state.roomCode) db.ref('draw-rooms/' + state.roomCode).remove();
    if (state.role === 'guest' && state.roomCode) db.ref('draw-rooms/' + state.roomCode + '/guest').set(false);
  });

  window.onload = () => { showScreen('screen-home'); };
</script>
